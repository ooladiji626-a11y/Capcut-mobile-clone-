    <script>
      // Suppress Vite HMR WebSocket connection errors in sandboxed iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes(':24678')))) {
              var fakeWs = {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(listener, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CONNECTING = 0;
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason &&
            (String(reason.message || reason).includes('WebSocket') ||
             String(reason.message || reason).includes('vite') ||
             String(reason.stack || '').includes('@vite/client'))
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (
            (event.message && String(event.message).includes('WebSocket')) ||
            (event.filename && String(event.filename).includes('@vite/client'))
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
